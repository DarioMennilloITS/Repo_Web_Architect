<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favourite Albums & Songs</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main>

        <section>
            <h2>Favourite Albums</h2>
            <div class="album">
                <div class="divAlbum">
                    <a href="https://www.youtube.com/watch?v=mNk9cbJqtjs">
                    <img src="./img/tosca-suzuki.jpg" alt="tosca-suzuki"></a>
                    <p class="titles">Tosca Suzuki</p>
                </div>
                <div class="divAlbum">
                    <a href="https://www.youtube.com/watch?v=yJj24t6nOn4&list=RDyJj24t6nOn4&start_radio=1">
                    <img src="./img/boards.jpg" alt="boards-canada"></a>
                    <p class="titles">Boards Canada</p>
                </div>
                <div class="divAlbum">
                    <a href="https://www.youtube.com/watch?v=Xw5AiRVqfqk&list=RDXw5AiRVqfqk">
                    <img src="./img/aphex.jpg" alt="aphex"></a>
                    <p class="titles">Aphex Twin</p>
                </div>
            </div>
        </section>

        <hr>

    
        <section>
            <h2>Favourite Songs</h2>
            <div class="songs">
                <div class="songBox">
                    <a href="https://www.youtube.com/watch?v=9_7fk2UpYzM">
                    <img src="./img/quasi.jpg" alt="moto"></a>
                    <p class="titles">Quasimoto</p>
                </div>
                <div class="songBox">
                    <a href="https://www.youtube.com/watch?v=aaPQsYqNDnY">
                    <img src="./img/hip1.jpg" alt="enemy"></a>
                    <p class="titles">Big Picture</p>
                </div>
                <div class="songBox">
                    <a href="https://www.youtube.com/watch?v=6jp8DbsK6rE">
                    <img src="./img/hop3.jpg" alt="train"></a>
                    <p class="titles">Train of Thought</p>
                </div>
            </div>
        </section>

        <hr>

      
        <section id="albumText">
            <h2>Info</h2>
            <p>This is a personal list of favourite songs and albums! :) enjoy</p>
        </section>
    </main>
</body>
</html>
