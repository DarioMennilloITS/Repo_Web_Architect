<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">To-Do List</h1>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <form id="todo-form">
                            <div class="mb-3">
                                <input type="text" class="form-control"
                                       id="todo-input"
                                       placeholder="Add new task"
                                       required>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label for="todo-date" class="form-label">Date</label>
                                    <input type="date" class="form-control" id="todo-date">
                                </div>
                                <div class="col-md-6">
                                    <label for="todo-time" class="form-label">Time</label>
                                    <input type="time" class="form-control" id="todo-time">
                                </div>
                            </div>
                            <div class="d-grid">
                                <button class="btn btn-primary" type="submit">
                                    Add
                                </button>
                            </div>
                        </form>
                        <template id="task-template">
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <span class="task-text"></span>
                                <input type="text" class="form-control edit-input" style="display: none;">
                                <div class="btn-group">
                                    <button class="btn btn-danger btn-sm delete-btn">&#x2715;</button>
                                    <button class="btn btn-primary btn-sm edit-btn">&#9998;</button>
                                </div>
                            </li>
                        </template>
                        <ul class="list-group" id="todo-list"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"> </script>
      <script src="./js/script.js"></script>
</body>

</html>
