<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="app">
        <header class="app__header">
            <div>
                <h1 class="app__title">To Do List</h1>
            </div>
        </header>

        <section class="composer">
            <form id="todoForm" class="composer__form" autocomplete="off">
                <label class="sr-only" for="itemInput">Item</label>
                <input id="itemInput" class="composer__input" type="text" placeholder="Insert Activity..." maxlength="80" required>
                <label class="sr-only" for="dateInput">Data</label>
                <input id="dateInput" class="composer__input" type="text" placeholder="dd/mm/yyyy" maxlength="10" required>
                <button class="composer__button" type="submit">Add</button>
            </form>
            <div class="composer__hint">Example: Go to the dentist - 10/03/2026</div>
        </section>

        <section class="board">
            <ul id="todoList" class="todo" aria-live="polite"></ul>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
