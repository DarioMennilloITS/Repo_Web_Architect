    <main>
        <section class="intro">
            <h2>Exercise 1: Counter</h2>
            <p>A simple interactive counter with increment, decrement and reset functions.</p>
        </section>

        <section class="exercise-area">
            <div class="counter-box">
                <h3>Current Value</h3>
                <div id="counterValue" class="counter-display">0</div>
                <p id="counterMessage" class="message"></p>
                
                <div class="counter-controls">
                    <button id="decrementBtn" class="btn-control">- Decrement</button>
                    <button id="resetBtn" class="btn-control">Reset</button>
                    <button id="incrementBtn" class="btn-control">+ Increment</button>
                </div>
                
                <div class="counter-info">
                    <p>Min: -100 | Max: 100</p>
                </div>
            </div>
        </section>
