    <main>
        <section class="intro">
            <h2>Exercise 2: Simple Calculator</h2>
            <p>Perform basic math operations with two numbers.</p>
        </section>

        <section class="exercise-area">
            <div class="calculator-box">
                <h3>Calculator</h3>
                
                <div class="calc-inputs">
                    <div class="input-group">
                        <label for="num1">First Number:</label>
                        <input type="number" id="num1" placeholder="Enter number">
                    </div>
                    
                    <div class="input-group">
                        <label for="operation">Operation:</label>
                        <select id="operation">
                            <option value="+">+ Addition</option>
                            <option value="-">- Subtraction</option>
                            <option value="*">* Multiplication</option>
                            <option value="/">/ Division</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label for="num2">Second Number:</label>
                        <input type="number" id="num2" placeholder="Enter number">
                    </div>
                </div>
                
                <div class="calc-buttons">
                    <button id="calculateBtn">Calculate</button>
                    <button id="clearBtn" class="btn-secondary">Clear</button>
                </div>
                
                <div class="calc-result">
                    <h4>Result:</h4>
                    <div id="resultDisplay" class="result-display">-</div>
                    <p id="calcMessage" class="message"></p>
                </div>
            </div>
        </section>
    </main>
