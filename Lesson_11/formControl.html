<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Compila il seguente form</h1>

    <form action="" id="mioForm" novalidate method="get">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>
        <br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="eta">Età</label>
        <input type="number" id="eta" name="eta" required>
        <br><br>

        <label for="nazionalita">Nazionalità</label>
        <select id="nazionalita" name="nazionalita" required>
            <option value="" disabled selected>Seleziona...</option>
            <option value="ITA">Italiana</option>
            <option value="FRA">Francese</option>
            <option value="ARG">Argentina</option>
            <option value="ENG">Inglese</option>
        </select>
        <br><br>
        <br><br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <button type="submit">Invia</button>

        
    </form>
    <div class="validationWarns"></div>

    <hr>
    <div class="demo"></div>

    <script src="./js/script02.js"></script>
</body>
</html>
